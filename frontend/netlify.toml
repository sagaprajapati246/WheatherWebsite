[build]
  command = "npm run build"
  publish = "dist"

# Handle client-side routing for React
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables for API
[context.production]
  environment = { VITE_API_URL = "https://your-backend-url.com" }

[context.deploy-preview]
  environment = { VITE_API_URL = "https://your-backend-url.com" }

[context.branch-deploy]
  environment = { VITE_API_URL = "https://your-backend-url.com" }
